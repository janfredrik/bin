# Example nginx site for bin. Adjust server_name and certificate paths.
server {
    listen 443 ssl;
    http2 on;
    server_name bin.example.com;

    ssl_certificate     /etc/letsencrypt/live/bin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bin.example.com/privkey.pem;

    # Keep a little above MAX_PASTE_KB (JSON escaping can grow the body).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

server {
    listen 80;
    server_name bin.example.com;
    return 301 https://$host$request_uri;
}
